# Tag-driven release. `make release VERSION=x.y.z` bumps, tags and pushes; this does the rest.
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: v0.82.1
          cache: true
          locked: true
      - name: Tag must match package version
        run: |
          pkg="v$(pixi run python -c 'import eval_harness; print(eval_harness.__version__)')"
          test "$pkg" = "${GITHUB_REF_NAME}" || { echo "tag $GITHUB_REF_NAME != package $pkg"; exit 1; }
      - run: pixi run check
      - run: pixi run demo
      - run: pixi run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  github-release:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Extract changelog section
        run: |
          awk -v ver="${GITHUB_REF_NAME#v}" '
            /^## \[/ { show = index($0, "[" ver "]") > 0 }
            show { print }
          ' CHANGELOG.md > release_notes.md
          test -s release_notes.md || echo "No changelog entry for ${GITHUB_REF_NAME}." > release_notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          files: dist/*
          generate_release_notes: true

  pypi:
    # Enable by creating a `pypi` environment in repo settings and a trusted publisher on PyPI,
    # then set repository variable PUBLISH_TO_PYPI=true. No API token is stored anywhere.
    if: vars.PUBLISH_TO_PYPI == 'true'
    runs-on: ubuntu-latest
    needs: verify
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
