name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: v0.82.1
          cache: true
      - name: Lint + typecheck + tests
        run: pixi run check
      - name: Validate golden set
        run: pixi run validate-data
      - name: Offline regression gate (mock providers, no secrets)
        run: pixi run demo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-reports
          path: reports/
