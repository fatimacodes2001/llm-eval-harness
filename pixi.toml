[workspace]
name = "llm-eval-harness"
description = "A reproducible evaluation harness for LLM structured-extraction tasks (sample / reference implementation)"
authors = ["Fatima Tuz Zehra"]
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64"]

[dependencies]
python = "3.12.*"
pydantic = ">=2.7"
typer = ">=0.12"
rich = ">=13"
pyyaml = ">=6"
numpy = ">=1.26"
jsonschema = ">=4.21"
httpx = ">=0.27"
python-dotenv = ">=1.0"

[pypi-dependencies]
anthropic = ">=0.50"
eval-harness = { path = ".", editable = true }

[feature.build.dependencies]
python-build = ">=1.2"
twine = ">=5"

[feature.dev.dependencies]
pytest = ">=8"
pytest-asyncio = ">=0.23"
pytest-cov = ">=5"
ruff = ">=0.5"
mypy = ">=1.10"
pre-commit = ">=3.7"
types-pyyaml = "*"
types-jsonschema = "*"

[environments]
# default: everything a developer needs. prod: runtime only, same resolved versions.
default = { features = ["dev", "build"], solve-group = "default" }
prod = { features = [], solve-group = "default" }

[tasks]
# --- quality gates ---------------------------------------------------------
fmt = "ruff format src tests scripts"
lint = "ruff check src tests scripts && ruff format --check src tests scripts"
typecheck = "mypy src"
test = "pytest"
check = { depends-on = ["lint", "typecheck", "test", "validate-data"] }
build = "rm -rf dist && python -m build && twine check dist/*"

# --- data ------------------------------------------------------------------
make-data = "python scripts/make_synthetic_golden.py --n 60 --seed 7 --out data/golden/hazards_v1.jsonl"
validate-data = "eval-harness validate-data data/golden/hazards_v1.jsonl"

# --- offline demo (no API key required) ------------------------------------
demo-baseline = "eval-harness run configs/mock_baseline.yaml"
demo-candidate = "eval-harness run configs/mock_candidate.yaml"
demo-compare = "eval-harness compare reports/mock_baseline reports/mock_candidate --min-f1-delta 0.0"
demo = { depends-on = ["demo-baseline", "demo-candidate", "demo-compare"] }

# --- real model runs (need ANTHROPIC_API_KEY) ------------------------------
eval-baseline = "eval-harness run configs/claude_baseline.yaml"
eval-candidate = "eval-harness run configs/claude_candidate.yaml"
eval-compare = "eval-harness compare reports/claude_baseline reports/claude_candidate --min-f1-delta 0.0 --max-hallucination 0.05"
smoke = "eval-harness run configs/claude_candidate.yaml --limit 5 --no-cache"
